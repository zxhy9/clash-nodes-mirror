name: Sync from Gitee (China speedtest)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Gitee b64 and decode to yaml
        run: |
          curl -fsSL "https://gitee.com/dxftbgu/clash-nodes/raw/master/clash_gitee.b64" -o clash_gitee.b64
          base64 -d clash_gitee.b64 > clash_gitee.yaml
          rm -f clash_gitee.b64
          echo "proxies count: $(grep -c '^  - name:' clash_gitee.yaml)"

      - name: Ensure correct DNS (defensive, same as local working config)
        run: |
          python3 - <<'PY'
          import yaml
          p='clash_gitee.yaml'
          d=yaml.safe_load(open(p))
          d['dns']={
            'enable':True,'enhanced-mode':'fake-ip','fake-ip-range':'198.18.0.1/16',
            'nameserver':['https://doh.pub/dns-query','https://dns.alidns.com/dns-query'],
            'fallback':['https://1.1.1.1/dns-query','https://dns.google/dns-query'],
            'proxy-server-nameserver':['https://doh.pub/dns-query'],
          }
          if 'rules' in d and not any(r.startswith('MATCH') for r in d['rules']):
            d['rules'].append('MATCH,GH-Manual')
          yaml.safe_dump(d, open(p,'w'), allow_unicode=True, sort_keys=False, default_flow_style=False, width=4096)
          print('dns ensured:', d['dns'].get('fallback'))
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add clash_gitee.yaml
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "daily sync: China-speedtested nodes from Gitee Go"
            git push
          fi
